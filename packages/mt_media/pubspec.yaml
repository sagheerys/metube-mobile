name: mt_media
description: "Shared playback: the audio_service handler, playback sources, position and state stores, the mini player."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  mt_core:
    path: ../mt_core
  mt_ui:
    path: ../mt_ui
  audio_service: ^0.18.15
  just_audio: ^0.10.6
  video_player: ^2.9.2
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # The `video_player` platform is faked in the tests, guarding the load-race
  # regression that used to leave orphaned players playing audio in the
  # background. Tests only, never production.
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true
