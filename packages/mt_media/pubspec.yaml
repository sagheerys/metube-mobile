name: mt_media
description: "تشغيل MTF المشترك: audio_service handler، مصادر التشغيل، مخازن الموضع والحالة، MiniPlayer."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  mt_core:
    path: ../mt_core
  mt_ui:
    path: ../mt_ui
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  just_audio: ^0.9.42
  video_player: ^2.9.2
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # منصة `video_player` مزيّفة في الاختبارات — انحدار سباق التحميل الذي
  # كان يترك مشغلات يتيمة تعمل صوتاً بالخلفية (اختبار وحده، لا الإنتاج).
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true
