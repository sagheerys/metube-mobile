name: metube_lite
description: "MeTube Lite — نسخة العائلة: حمّل واحتفظ، والسيرفر يتنظف تلقائياً."
publish_to: none
resolution: workspace
version: 2.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  mt_core:
    path: ../../packages/mt_core
  mt_media:
    path: ../../packages/mt_media
  mt_ui:
    path: ../../packages/mt_ui
  audio_service: ^0.18.15
  cached_network_image: ^3.4.1
  # م-42/م-43: بوابة «Wi‑Fi فقط» قبل السحب، وإعادة المحاولة عند عودة
  # الشبكة. (Super يستعملها أصلاً للتبديل التلقائي — م-28.)
  connectivity_plus: ^6.1.0
  # منتقي ملفات النظام (SAF): أندرويد 11+ يمنع قراءة ملف لم ينشئه
  # التطبيق، فاستيراد نسخة من جهاز آخر (م-31) لا يعمل بمسار ثابت.
  file_picker: ^10.0.0
  # Lite وحده (TRD §1): استمرار التحميل بالخلفية (م-10) وإشعاراته (م-9)
  # وطلب أذونات الإشعارات/الوسائط الحديثة بتدفق مهذب.
  flutter_background: ^1.3.1
  flutter_local_notifications: ^22.3.0
  permission_handler: ^13.0.1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  go_router: ^16.2.0
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  receive_sharing_intent: ^1.8.1
  share_plus: ^10.1.2
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

# أيقونة المشغّل من الهوية المعتمدة (سجل §4: أيقونتان توأمان).
# تُولَّد الصور بـ `python tool/make_icons.py` ثم:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/icon.png
  # الخلفية **لون الفعل صلباً** لا كريمي: التصميم إطار فيلم يملأ اللوحة،
  # فما يظهر عند تأثير المنظور (parallax) يجب أن يكون امتداد لونه.
  adaptive_icon_background: "#2F6D74"
  adaptive_icon_foreground: assets/icons/icon_foreground.png
  # أندرويد 13+ «الأيقونات المتناسقة»: بلا هذه الطبقة يرسم النظام
  # الأمامية كما هي فتظهر شاذّة بين أيقونات ملوّنة بلون الخلفية.
  adaptive_icon_monochrome: assets/icons/icon_monochrome.png
  min_sdk_android: 23
