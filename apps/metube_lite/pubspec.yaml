name: metube_lite
description: "MeTube Lite — the family edition: download and keep, and the server cleans itself up."
publish_to: none
resolution: workspace
version: 2.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  mt_core:
    path: ../../packages/mt_core
  mt_media:
    path: ../../packages/mt_media
  mt_ui:
    path: ../../packages/mt_ui
  audio_service: ^0.18.15
  cached_network_image: ^3.4.1
  # The "Wi-Fi only" gate before a pull, and retrying when the network comes
  # back. (Super already uses it for automatic server switching.)
  connectivity_plus: ^6.1.0
  # The system file picker (SAF). Android 11+ forbids reading a file the app
  # did not create, so importing a backup from another device cannot work
  # from a fixed path.
  file_picker: ^11.0.3
  # Lite only: downloads that continue in the background, and their
  # notifications.
  # **`permission_handler` was removed**: it had zero imports in the code. The
  # notification permission is requested by `flutter_local_notifications`
  # itself, and the media permissions are declared in the manifest — a whole
  # native package for an API nobody called.
  flutter_background: ^1.3.1
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  go_router: ^16.2.0
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  receive_sharing_intent: ^1.8.1
  share_plus: ^10.1.2
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

# The launcher icon. The images are generated by `python tool/make_icons.py`,
# then:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/icon.png
  # The background is **the solid accent colour**, not the cream: the design is
  # a film frame filling the plate, so whatever the parallax effect reveals has
  # to be an extension of its colour.
  adaptive_icon_background: "#2F6D74"
  adaptive_icon_foreground: assets/icons/icon_foreground.png
  # Android 13+ themed icons. Without this layer the system draws the
  # foreground as-is, which looks out of place among icons tinted to match the
  # wallpaper.
  adaptive_icon_monochrome: assets/icons/icon_monochrome.png
  min_sdk_android: 23
