# **Memory measured, not copied.** This machine has 15.5GB in total, and the
# values here used to be an 8G heap plus 4G metaspace = 12G for the Gradle
# daemon alone, while the emulator and the Dart analysis server run beside it.
# 3G is enough for this project without swapping.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# **Measured on this machine:** a debug build with nothing changed went from
# 84s to **13s**, and an incremental build after a real Dart edit takes 29s.
org.gradle.parallel=true
org.gradle.caching=true

# Do not enable `org.gradle.configuration-cache`: it was tried here and broke
# the build — Flutter's Gradle plugin is not compatible with it yet
# (`DependencyVersionChecker` cannot be cached).

# **The barcode model comes from Google Play services, not from the APK**
# (م-74). `mobile_scanner` bundles MLKit's scanner by default, which
# measured **+15.5MB** on this app: 25.0MB to 40.5MB for a feature used
# once, during setup, on a family phone. Unbundled, Play services supplies
# the model the first time the scanner opens.
#
# **The cost, stated:** a phone with no Play services cannot scan. It can
# still be set up by typing the address, which is what the scanner
# replaced rather than removed, and `errorBuilder` on the scanner says so.
dev.steenbakker.mobile_scanner.useUnbundled=true
