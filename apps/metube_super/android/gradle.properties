# **الذاكرة مقيسة لا منسوخة (2026-09-03):** الجهاز 15.5 غ.ب إجمالاً، وكان
# هنا 8G كومة + 4G ميتاسبيس = 12G لعفريت Gradle وحده — بينما يعمل معه
# المحاكي وخادم تحليل Dart. 3G تكفي هذا المشروع بلا مبادلة.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# **قياس على هذا الجهاز:** بناء debug بلا أي تغيير 84 ث ⇒ **13 ث**،
# وبناء تزايدي بعد تعديل dart حقيقي ⇒ 29 ث.
org.gradle.parallel=true
org.gradle.caching=true

# ⚠️ لا تُفعّل `org.gradle.configuration-cache`: مُجرَّبة هنا فأسقطت
# البناء — إضافة Flutter لـGradle غير متوافقة معها بعد
# (`DependencyVersionChecker` لا يُخزَّن).

