name: metube_super
description: "MeTube Super — نسخة مالك السيرفر: بث، مكتبة موحدة، وسوم، إدارة."
publish_to: none
resolution: workspace
version: 2.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  mt_core:
    path: ../../packages/mt_core
  mt_media:
    path: ../../packages/mt_media
  mt_ui:
    path: ../../packages/mt_ui
  audio_service: ^0.18.15
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.0
  # منتقي ملفات النظام (SAF): أندرويد 11+ يمنع قراءة ملف لم ينشئه
  # التطبيق، فاستيراد نسخة من جهاز آخر (م-31) لا يعمل بمسار ثابت.
  file_picker: ^10.0.0
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  go_router: ^16.2.0
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  receive_sharing_intent: ^1.8.1
  share_plus: ^10.1.2
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1

dev_dependencies:
  # اختبارات الشبكة تحقن محوّل HTTP مزيفاً في `MeTubeApiClient` — dio
  # تبعية غير مباشرة عبر mt_core، وإعلانها هنا يجعل الاستيراد شرعياً.
  dio: ^5.7.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

# أيقونة المشغّل من الهوية المعتمدة (سجل §4: أيقونتان توأمان).
# تُولَّد الصور بـ `python tool/make_icons.py` ثم:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/icon.png
  # الطبقة الأمامية رمز وحده: القناع الدائري في بعض المشغّلات يقصّ
  # الشارة السفلية، والتمييز الحقيقي بين النسختين لونها ورمزها.
  adaptive_icon_background: "#FBF6EE"
  adaptive_icon_foreground: assets/icons/icon_foreground.png
  min_sdk_android: 23
