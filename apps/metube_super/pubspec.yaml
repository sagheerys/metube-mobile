name: metube_super
description: "MeTube Super — نسخة مالك السيرفر: بث، مكتبة موحدة، وسوم، إدارة."
publish_to: none
resolution: workspace
version: 2.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  mt_core:
    path: ../../packages/mt_core
  mt_media:
    path: ../../packages/mt_media
  mt_ui:
    path: ../../packages/mt_ui
  audio_service: ^0.18.15
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.0
  # منتقي ملفات النظام (SAF): أندرويد 11+ يمنع قراءة ملف لم ينشئه
  # التطبيق، فاستيراد نسخة من جهاز آخر (م-31) لا يعمل بمسار ثابت.
  file_picker: ^10.0.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  go_router: ^16.2.0
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  receive_sharing_intent: ^1.8.1
  share_plus: ^10.1.2
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
