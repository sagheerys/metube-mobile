name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      # One resolve for the whole workspace; every package shares it.
      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-pub

      # mt_core is pure Dart, so it runs under `dart test`; the rest need
      # the Flutter test runner.
      - name: Test mt_core
        run: dart test
        working-directory: packages/mt_core

      - name: Test mt_media
        run: flutter test --no-pub
        working-directory: packages/mt_media

      - name: Test mt_ui
        run: flutter test --no-pub
        working-directory: packages/mt_ui

      - name: Test metube_lite
        run: flutter test --no-pub
        working-directory: apps/metube_lite

      - name: Test metube_super
        run: flutter test --no-pub
        working-directory: apps/metube_super

  # One runner per app, deliberately. Both builds in a single job filled the
  # hosted runner's disk and the second one died with "No space left on
  # device" (measured 2026-09-09) — an Android SDK, a Gradle cache and two
  # sets of build output do not fit in the ~14GB a standard runner has.
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        app: [metube_lite, metube_super]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Debug builds only: release signing needs a keystore that is not in
      # this repository.
      - name: Build ${{ matrix.app }}
        run: flutter build apk --debug
        working-directory: apps/${{ matrix.app }}
