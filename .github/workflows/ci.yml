name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      # One resolve for the whole workspace; every package shares it.
      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-pub

      # mt_core is pure Dart, so it runs under `dart test`; the rest need
      # the Flutter test runner.
      - name: Test mt_core
        run: dart test
        working-directory: packages/mt_core

      - name: Test mt_media
        run: flutter test --no-pub
        working-directory: packages/mt_media

      - name: Test mt_ui
        run: flutter test --no-pub
        working-directory: packages/mt_ui

      - name: Test metube_lite
        run: flutter test --no-pub
        working-directory: apps/metube_lite

      - name: Test metube_super
        run: flutter test --no-pub
        working-directory: apps/metube_super

      # Debug builds only: release signing needs a keystore that is not in
      # this repository.
      - name: Build metube_lite
        run: flutter build apk --debug
        working-directory: apps/metube_lite

      - name: Build metube_super
        run: flutter build apk --debug
        working-directory: apps/metube_super
